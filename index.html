<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>♡</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;background:#000}#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;z-index:3;border:0;font:600 18px Arial;letter-spacing:.2px}#start span{padding:15px 24px;border:1px solid rgba(255,255,255,.35);border-radius:999px;box-shadow:0 0 24px rgba(70,150,255,.2)}
</style>
</head>
<body>
<button id="start"><span>klepni sem ♡</span></button>
<canvas id="c"></canvas>
<audio id="music" src="love_you.mp3" preload="auto"></audio>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const start=document.getElementById('start'),music=document.getElementById('music');
let W,H,cx,cy,scale,started=false,t0=0,particles=[];
const colors=['#4682b4','#1e90ff','#00bfff','#6495ed','#4169e1'];
function heart(t){return [16*Math.sin(t)**3,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]}
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H/2;scale=Math.min(W/40,H/31);build()}
function add(x,y,delay,kind){particles.push({x,y,delay,kind,a:0,phase:Math.random()*6.28,size:(kind==='outline'?Math.max(12,Math.min(20,W/48)):Math.max(10,Math.min(17,W/58)))*(0.85+Math.random()*.3),color:colors[Math.floor(Math.random()*colors.length)]})}
function build(){particles=[];let placed=[];const n=160;for(let i=0;i<n;i++){let t=i/n*Math.PI*2,[x,y]=heart(t);x=cx+x*scale;y=cy+y*scale;let gap=Math.max(19,Math.min(30,W/30));if(placed.some(q=>Math.hypot(x-q[0],y-q[1])<gap))continue;placed.push([x,y]);add(x,y,i*26,'outline')}
placed=[];let attempts=0;while(placed.length<130&&attempts++<10000){let t=Math.random()*Math.PI*2,r=Math.random()*.86,[x,y]=heart(t);x=cx+x*r*scale;y=cy+y*r*scale;let gap=Math.max(27,Math.min(46,W/20));if(placed.some(q=>Math.hypot(x-q[0],y-q[1])<gap))continue;placed.push([x,y]);add(x,y,4300+Math.random()*2600,'fill')}}
function glowText(text,x,y,size,color,alpha,bold=true){ctx.save();ctx.globalAlpha=alpha;ctx.font=`${bold?'700':'600'} ${size}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=size*.75;ctx.fillText(text,x,y);ctx.shadowBlur=size*.25;ctx.fillText(text,x,y);ctx.restore()}
function ease(x){return 1-Math.exp(-Math.max(0,x)*7)}
function frame(now){ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(!started){requestAnimationFrame(frame);return}let ms=now-t0;
for(const p of particles){let a=Math.min(1,Math.max(0,(ms-p.delay)/420));if(a<=0)continue;let flick=.82+.18*Math.sin(ms*.0025+p.phase);glowText('blbeček',p.x,p.y,p.size,p.color,a*flick)}
// center question appears only after the heart has formed
if(ms>9000){let a=ease((ms-9000)/1200);let pulse=1+.018*Math.sin(ms*.004);let size=Math.max(22,Math.min(48,W/17))*pulse;glowText('takže jsme v pohodě?',cx,cy,size,'#fffaf5',a)}
requestAnimationFrame(frame)}
start.addEventListener('click',async()=>{start.style.display='none';started=true;t0=performance.now();try{music.currentTime=0;await music.play()}catch(e){} });
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script>
</body>
</html>
